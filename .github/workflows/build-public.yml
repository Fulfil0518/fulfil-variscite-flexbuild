#
# Continuous-integration workflow for Debian image builds.
# Runs only on public repositories using GitHub’s free hosted runners.
#
# The workflow has two high-level phases:
#   - Prepare a Docker build environment (restore cached image or build it)
#   - Use that container to compile U-Boot, Linux, rootfs and images

name: Build Debian Bookworm Image
run-name: Build Debian Bookworm Image (${{ inputs.kernel_version_name }})

on:
  workflow_dispatch:
    inputs:
      kernel_version_name:
        description: 'A unique name used to help describe the kernel for human readability. This will be combined with other identifiers in the final version string. Please only use alphanumeric or -'
        type: string
        required: true
      kernel_commit:
        description: 'The commit for https://github.com/Fulfil0518/fulfil-variscite-debian-kernel'
        type: string
        required: true

env:
  SOPS_PRIVATE_KEY: ${{ secrets.SOPS_PRIVATE_KEY }}

jobs:
  build-flexbuild:
    # Skip the entire job if the repository is private
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        machine:
          - imx8mn-var-som
        rootfs:
          - server
          # - desktop

    steps:
      # GitHub-hosted runners expose additional space under /mnt.
      # Replace the default workspace with a symlink to gain ~30 GB.
      - name: Setup workspace on GitHub-hosted runner using /mnt with more storage
        if: "!contains(runner.labels, 'self-hosted')"
        run: |
          echo "Redirecting workspace to /mnt/work"
          sudo mkdir -p /mnt/work
          sudo rm -rf "$GITHUB_WORKSPACE"
          sudo ln -s /mnt/work "$GITHUB_WORKSPACE"
          sudo chown -R $USER:$USER /mnt/work

      - name: Refresh APT and install flexbuild deps
        run: |
          sudo apt-get update -yqq
          sudo apt-get install -yqq --no-install-recommends \
            binfmt-support qemu-system-common qemu-user-static

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Register QEMU for arm64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
          cache-image: false

      # Quick sanity-check on available storage
      - name: Report disk free space
        run: |
          echo "=== Filesystem usage ==="
          df -h /
          echo
          echo "=== /mnt usage ==="
          df -h /mnt || echo "/mnt not mounted"

      - name: Print build information
        run: |
          echo "Building ${{ matrix.machine }}:${{ matrix.rootfs }}"
          echo "flexbuild reference: ${{ inputs['flexbuild-ref'] }}"

      ############################################################
      # Prepare Docker build environment
      ############################################################

      # Build the container from scratch
      - name: Build NXP Docker container
        run: |
          . setup.env || true
          echo "FBDIR is '$FBDIR'"
          bld docker || true

      # Export container name for subsequent steps
      - name: Save container name to variable
        run: |
          . setup.env || true
          echo "CONTAINER_NAME=fbdebian" >> $GITHUB_ENV

      # Show current Docker state before launching the container
      - name: List images and containers pre-run
        run: |
          echo "=== Docker images ==="
          docker images fbdebian || true
          echo
          echo "=== Containers before run ==="
          docker ps -a

      # Launch the privileged build container
      - name: Run Docker container
        run: |
          . setup.env || true
          echo "Starting container: $CONTAINER_NAME"
          docker run -d --name "$CONTAINER_NAME" --privileged --net=host \
            -v "$HOME:$HOME" -v "$FBDIR:$FBDIR" -v /lib/modules:/lib/modules -v /dev:/dev \
            -v /etc/localtime:/etc/localtime:ro \
            --add-host=fbdebian:127.0.0.1 \
            -w "$FBDIR" fbdebian:12 tail -f /dev/null

      # Confirm container launch
      - name: List images and containers post-run
        run: |
          echo "=== Docker images ==="
          docker images fbdebian || true
          echo
          echo "=== Containers after run ==="
          docker ps -a

      # Quick health-check
      - name: Run test command inside container
        run: |
          docker exec "$CONTAINER_NAME" echo "Container up"

      ############################################################
      # Build firmware and images inside the container
      ############################################################

      - name: Install host dependencies
        run: |
          docker exec "$CONTAINER_NAME" /bin/bash -c '
            . setup.env || true
            time bld host-dep
          '

      - name: Verify template
        run: |
          docker exec "$CONTAINER_NAME" /bin/bash -c '
            . setup.env || true
            export KERNEL_VERSION="${{ inputs.kernel_version_name }}"
            export KERNEL_COMMIT="${{ inputs.kernel_commit }}"
            envsubst < configs/ci.yml.template > configs/ci.yml
            cat configs/ci.yml
          '
      
      - name: Setup SOPS packages
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg
          curl -LO https://github.com/getsops/sops/releases/download/v3.12.2/sops_3.12.2_amd64.deb
          sudo apt-get install -y ./sops_3.12.2_amd64.deb
          rm ./sops_3.12.2_amd64.deb

      - name: Setup SOPS private key
        run: |
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

          printf '%s\n' "$SOPS_PRIVATE_KEY" | gpg --batch --import
      
      - name: Decrypt SOPS files
        run: |
          set -euo pipefail

          for dir in lfp common; do
            src_dir="src/apps/fulfil/secrets/$dir"
            dst_dir="src/apps/fulfil/files/$dir"

            mkdir -p "$dst_dir"

            for src in "$src_dir"/*.sops; do
              [ -e "$src" ] || continue

              base="$(basename "$src" .sops)"
              dst="$dst_dir/$base"

              echo "Decrypting $src -> $dst"
              sops -d --input-type binary "$src" > "$dst"
              chmod 600 "$dst"
            done
          done

      - name: Build U-Boot
        run: |
          docker exec "$CONTAINER_NAME" /bin/bash -c '
            . setup.env || true
            bld -r debian:${{ matrix.rootfs }} -m ${{ matrix.machine }} -f ci.yml uboot
          '

      - name: Build Linux
        run: |
          docker exec "$CONTAINER_NAME" /bin/bash -c '
            . setup.env || true
            bld -r debian:${{ matrix.rootfs }} -m ${{ matrix.machine }} -f ci.yml linux
          '

      - name: Build root filesystem
        run: |
          docker exec "$CONTAINER_NAME" /bin/bash -c '
            . setup.env || true
            bld -r debian:${{ matrix.rootfs }} -m ${{ matrix.machine }} -f ci.yml rfs
          '

      - name: Build applications
        run: |
          docker exec "$CONTAINER_NAME" /bin/bash -c '
            . setup.env || true
            bld -r debian:${{ matrix.rootfs }} -m ${{ matrix.machine }} -f ci.yml apps
          '

      - name: Merge applications into rootfs
        run: |
          docker exec "$CONTAINER_NAME" /bin/bash -c '
            . setup.env || true
            bld -r debian:${{ matrix.rootfs }} -m ${{ matrix.machine }} -f ci.yml merge-apps
          '

      - name: Merge boot partition and rootfs
        run: |
          docker exec "$CONTAINER_NAME" /bin/bash -c '
            . setup.env || true
            bld -r debian:${{ matrix.rootfs }} -m ${{ matrix.machine }} -f ci.yml merge-bootpart-rfs
          '

      - name: Create recovery SD-card image
        run: |
          docker exec "$CONTAINER_NAME" /bin/bash -c '
            . setup.env || true
            bld -r debian:${{ matrix.rootfs }} -m ${{ matrix.machine }} -f ci.yml create-recovery-sdcard-image
          '

      - name: Authenticate to GCS
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCS_SECRET }}

      - name: Build GCS directory name
        id: upload-dir
        shell: bash
        run: |
          KERNEL_VERSION_NAME="${{ inputs.kernel_version_name }}"
          KERNEL_COMMIT="${{ inputs.kernel_commit }}"
          BUILD_TIMESTAMP="$(date -u +'%Y%m%dT%H%M%SZ')"

          SAFE_KERNEL_VERSION_NAME="$(echo "$KERNEL_VERSION_NAME" | sed 's/[^A-Za-z0-9-]/-/g')"

          DIR_NAME="${BUILD_TIMESTAMP}-${SAFE_KERNEL_VERSION_NAME}-${KERNEL_COMMIT}"

          echo "value=$DIR_NAME" >> "$GITHUB_OUTPUT"
          echo "GCS bucket dir: $DIR_NAME"

      - name: Stage image files
        run: |
          mkdir -p upload
          cp -L build_lsdk2412/images/rootfs_lsdk2412_debian_${{ matrix.rootfs }}_arm64.tar.zst \
            upload/rootfs_lsdk2412_debian_${{ matrix.rootfs }}_arm64.tar.zst

          cp -L build_lsdk2412/images/var-recovery-image-${{ matrix.machine }}.img.bmap \
            upload/var-recovery-image-${{ matrix.machine }}.img.bmap

          cp -L build_lsdk2412/images/var-recovery-image-${{ matrix.machine }}.img.zst \
            upload/var-recovery-image-${{ matrix.machine }}.img.zst

      - name: Upload recovery image to GCS
        uses: google-github-actions/upload-cloud-storage@v3
        with:
          path: upload/
          destination: varsom-debian-image/${{ steps.upload-dir.outputs.value }}/
          parent: false

      - name: Generate kernel debian package
        run: |
          docker exec "$CONTAINER_NAME" /bin/bash -c '
            . setup.env || true
            bld -r debian:${{ matrix.rootfs }} -m ${{ matrix.machine }} -f ci.yml kernel-deb
          '

      - name: Authenticate for Artifact Registry
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.ARTIFACT_REGISTRY_SECRET }}

      - name: Upload to Artifact Registry
        run: |
          gcloud artifacts apt upload marsctl-staging \
            --project=fulfil-web-staging-296222 \
            --location=us \
            --source=build_lsdk2412/imx8mn-debian-kernel.deb

      - name: Show links
        run: |
          package_version=$(cat build_lsdk2412/imx8mn-debian-kernel-version)
          echo "Built OS image can be found here:"
          echo "https://console.cloud.google.com/storage/browser/varsom-debian-image/${{ steps.upload-dir.outputs.value }}"
          echo ""
          echo "Debian kernel package can be found here:"
          echo "https://console.cloud.google.com/artifacts/apt/fulfil-web-staging-296222/us/marsctl-staging/imx8mn-debian-kernel/$package_version"
          echo "and can be installed using:"
          echo "apt-get install imx8mn-debian-kernel=$package_version"
          echo "or"
          echo "make kernel-swap LOCATION=[location] TARGET=[target] VERSION=$package_version"