# [general]
machine=imx8mn-var-som

MACHINE_LIST="imx8mn-var-som"

KERNEL_DEVICETREE=" \
	freescale/imx8mn-var-som-symphony-1.x.dtb \
	freescale/imx8mn-var-som-symphony-1.x-m7.dtb \
	freescale/imx8mn-var-som-symphony-1.x-root.dtb \
	freescale/imx8mn-var-som-1.x-symphony.dtb \
	freescale/imx8mn-var-som-1.x-symphony-m7.dtb \
	freescale/imx8mn-var-som-1.x-symphony-root.dtb \
	freescale/imx8mn-var-som-inmate.dtb \
	freescale/imx8mn-var-som-symphony.dtb \
	freescale/imx8mn-var-som-symphony-m7.dtb \
	freescale/imx8mn-var-som-symphony-root.dtb \
	freescale/imx8mn-var-som-wbe-symphony.dtb \
	freescale/imx8mn-var-som-wbe-symphony-m7.dtb \
	freescale/imx8mn-var-som-wbe-symphony-root.dtb \
	freescale/imx8mn-var-som-fulfil-lfp.dtb \
	freescale/imx8mn-var-som-fulfil-mars.dtb \
"

UBOOT_CONFIG="imx8mn_var_som_defconfig"

IMX_MKIMAGE_DTBS="imx8mn-var-som-symphony.dtb"
IMX_MKIMAGE_TARGET="flash_ddr4_evk"
IMX_MKIMAGE_PATCHES=" \
    0001-iMX8M-soc-allow-dtb-override.patch \
    0002-iMX8M-soc-change-padding-of-DDR4-and-LPDDR4-DMEM-fir.patch \
"

COMPOSITE_IMG1_FILE_sd="bsp/imx-mkimage/imx8mn-var-som/flash.bin"
FLASH_BIN="$DEFAULT_OUT_PATH/${COMPOSITE_IMG1_FILE_sd}"
GENIMAGE_CFG="$FBDIR/configs/board/common/var-imx-sd-genconfig.conf"

# offset 32k
DISK_BOOTLOADER_OFFSET="32768"

# freeRTOS board target
CM_BOARD="som_mx8mn"

# Recovery SD Card Configuration
INSTALL_DEBIAN_SCRIPT="https://raw.githubusercontent.com/varigit/meta-variscite-sdk-imx/037a5ce07d271ddb7d6f8389778816ef4e877c32/scripts/var_mk_yocto_sdcard/variscite_scripts/mx8_install_yocto.sh"
INSTALL_DEBIAN_ECHOS="https://raw.githubusercontent.com/varigit/meta-variscite-sdk-imx/037a5ce07d271ddb7d6f8389778816ef4e877c32/scripts/var_mk_yocto_sdcard/variscite_scripts/echos.sh"
INSTALL_DEBIAN_TARGET_BOOT="imx-boot-sd.bin"
INSTALL_DEBIAN_TARGET_ROOTFS="rootfs.tar.zst"

# Disable G2D
ENABLE_G2D="false"
